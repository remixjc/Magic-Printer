name: Build and Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-14
            platform: mac
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Align package version with release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const version=process.env.GITHUB_REF_NAME.replace(/^v/,''); for (const file of ['package.json','apps/desktop/package.json']) { const path=require('node:path').resolve(file); const data=JSON.parse(fs.readFileSync(path)); data.version=version; fs.writeFileSync(path, JSON.stringify(data,null,2)+'\\n'); }"
      - name: Rebuild Electron native dependencies
        run: pnpm --filter @magic-printer/desktop exec electron-builder install-app-deps
      - name: Build platform package
        run: pnpm build
      - name: Package and publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && 'true' || 'false' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish always
      - name: Generate release checksums
        working-directory: apps/desktop
        shell: bash
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const dir = path.resolve('../../release');
          const platform = process.env.RELEASE_PLATFORM;
          const files = fs.readdirSync(dir).filter((name) => !name.startsWith('SHA256SUMS-'));
          const lines = files.map((name) => {
            const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(dir, name))).digest('hex');
            return `${hash}  ${name}`;
          });
          const output = path.join(dir, `SHA256SUMS-${platform}.txt`);
          fs.writeFileSync(output, `${lines.join('\n')}\n`);
          console.log(output);
          NODE
          gh release upload "$GITHUB_REF_NAME" "../../release/SHA256SUMS-${RELEASE_PLATFORM}.txt" --clobber
